services:
  techpack-app:
    build: .
    container_name: techpack_automation
    ports:
      - "5000:5001"
    volumes:
      - .:/app
      - /app/venv  # Prevent local venv from overwriting container's dependencies
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
